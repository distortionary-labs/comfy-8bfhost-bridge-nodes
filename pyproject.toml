[project]
name = "comfy-8bfhost-bridge-nodes"
version = "0.1.0"
description = "ComfyUI nodes that run Photoshop-compatible filter plug-ins (.8bf) through 8bf-host"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# ComfyUI already provides numpy and torch; 8bf-host is installed separately.
dependencies = []

[project.urls]
Repository = "https://github.com/distortionary-labs/comfy-8bfhost-bridge-nodes"

[tool.comfy]
PublisherId = "distortionary-labs"
DisplayName = "8bf-host Bridge Nodes"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B905 (zip strict=) needs Python 3.10.
ignore = ["E731", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["comfy_8bfhost_bridge", "conftest"]
